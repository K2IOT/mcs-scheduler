syntax = "proto3";

package mcs.scheduler.v1;

option java_multiple_files = true;
option java_package = "io.k2iot.mcs.scheduler.v1";
option java_outer_classname = "SchedulerEventProto";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

enum SchedulerCommandType {
  SCHEDULER_COMMAND_TYPE_UNSPECIFIED = 0;
  SCHEDULER_COMMAND_TYPE_CREATE_JOB = 1;
  SCHEDULER_COMMAND_TYPE_UPDATE_JOB = 2;
  SCHEDULER_COMMAND_TYPE_PAUSE_JOB = 3;
  SCHEDULER_COMMAND_TYPE_RESUME_JOB = 4;
  SCHEDULER_COMMAND_TYPE_DELETE_JOB = 5;
  SCHEDULER_COMMAND_TYPE_CREATE_TRIGGER = 6;
  SCHEDULER_COMMAND_TYPE_REPLACE_TRIGGER = 7;
  SCHEDULER_COMMAND_TYPE_PAUSE_TRIGGER = 8;
  SCHEDULER_COMMAND_TYPE_RESUME_TRIGGER = 9;
  SCHEDULER_COMMAND_TYPE_DELETE_TRIGGER = 10;
  SCHEDULER_COMMAND_TYPE_FIRE_TRIGGER_NOW = 11;
  SCHEDULER_COMMAND_TYPE_CREATE_SCHEDULE = 12;
}

enum CommandResultStatus {
  COMMAND_RESULT_STATUS_UNSPECIFIED = 0;
  COMMAND_RESULT_STATUS_SUCCEEDED = 1;
  COMMAND_RESULT_STATUS_REJECTED = 2;
  COMMAND_RESULT_STATUS_FAILED = 3;
}

message SchedulerErrorDetail {
  string code = 1;
  string message = 2;
}

message SchedulerCommandResultEvent {
  int32 schema_version = 1;
  string message_id = 2;
  string request_id = 3;
  google.protobuf.Timestamp occurred_at = 4;
  string producer = 5;
  string namespace = 6;
  SchedulerCommandType command_type = 7;
  CommandResultStatus status = 8;
  google.protobuf.Struct result = 9;
  SchedulerErrorDetail error = 10;
}

message ScheduledExecutionEvent {
  int32 schema_version = 1;
  string execution_id = 2;
  string namespace = 3;
  string event_type = 4;
  string job_id = 5;
  string trigger_id = 6;
  google.protobuf.Timestamp scheduled_fire_time = 7;
  google.protobuf.Timestamp actual_fire_time = 8;
  bool recovery = 9;
  google.protobuf.Struct payload = 10;
  map<string, string> headers = 11;
}
