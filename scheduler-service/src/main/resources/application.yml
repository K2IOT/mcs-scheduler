server:
  port: 8080

spring:
  application:
    name: mcs-scheduler
  grpc:
    server:
      port: 9090
      health:
        enabled: true
  flyway:
    default-schema: public
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      client-id: mcs-scheduler-${mcs.scheduler.instance-id}
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
    listener:
      ack-mode: record
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceName: mcs-scheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.scheduler.batchTriggerAcquisitionMaxCount: 10
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.tablePrefix: quartz.QRTZ_
      org.quartz.jobStore.clusterCheckinInterval: 10000
      org.quartz.jobStore.misfireThreshold: 60000
      org.quartz.jobStore.acquireTriggersWithinLock: true
      org.quartz.threadPool.threadCount: 10

mcs:
  scheduler:
    instance-id: ${MCS_SCHEDULER_INSTANCE_ID:${HOSTNAME:local}}
    kafka:
      command-topic: ${MCS_SCHEDULER_KAFKA_COMMAND_TOPIC:mcs.scheduler.commands.v1}
      command-result-topic: ${MCS_SCHEDULER_KAFKA_COMMAND_RESULT_TOPIC:mcs.scheduler.command-results.v1}
      dlt-topic: ${MCS_SCHEDULER_KAFKA_DLT_TOPIC:mcs.scheduler.commands.v1.DLT}
      consumer-group: ${MCS_SCHEDULER_KAFKA_CONSUMER_GROUP:mcs-scheduler}
      partitions: ${MCS_SCHEDULER_KAFKA_PARTITIONS:6}
      replicas: ${MCS_SCHEDULER_KAFKA_REPLICAS:1}
      retry-backoff-ms: ${MCS_SCHEDULER_KAFKA_RETRY_BACKOFF_MS:250}
      retry-attempts: ${MCS_SCHEDULER_KAFKA_RETRY_ATTEMPTS:2}
    outbox:
      enabled: ${MCS_SCHEDULER_OUTBOX_ENABLED:true}
      batch-size: ${MCS_SCHEDULER_OUTBOX_BATCH_SIZE:100}
      poll-interval: ${MCS_SCHEDULER_OUTBOX_POLL_INTERVAL:1s}
      claim-timeout: ${MCS_SCHEDULER_OUTBOX_CLAIM_TIMEOUT:30s}
      publish-timeout: ${MCS_SCHEDULER_OUTBOX_PUBLISH_TIMEOUT:30s}
      max-attempts: ${MCS_SCHEDULER_OUTBOX_MAX_ATTEMPTS:20}
      max-age: ${MCS_SCHEDULER_OUTBOX_MAX_AGE:24h}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
