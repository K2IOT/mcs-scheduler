name: Task 10 Execution Verification

on:
  push:
    branches:
      - agent/task-10-durable-scheduled-executions
  pull_request:
    paths:
      - 'scheduler-service/**'
      - '.github/workflows/task-10-execution-verification.yml'

jobs:
  verify-task-10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Focused Task 10 tests
        run: ./mvnw -B -pl scheduler-service -am -Dtest=ScheduledExecutionServiceTest,ScheduledExecutionIT test
      - name: Spotless
        run: ./mvnw -B spotless:check
      - name: Full verification
        run: ./mvnw -B verify
