name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Enable Maven wrapper
        run: chmod +x mvnw

      - name: Check Java formatting
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp spotless:check 2>&1 | tee spotless.log

      - name: Run full Maven verification
        if: always()
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp verify 2>&1 | tee verify.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-diagnostics
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            spotless.log
            verify.log
          if-no-files-found: warn
