name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Enable Maven wrapper
        run: chmod +x mvnw

      - name: Run fast unit and architecture tests
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp test 2>&1 | tee test.log

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            **/target/surefire-reports/**
            test.log
          if-no-files-found: warn

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Enable Maven wrapper
        run: chmod +x mvnw

      - name: Check Java formatting
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp spotless:check 2>&1 | tee spotless.log

      - name: Upload quality diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics
          path: spotless.log
          if-no-files-found: warn

  integration:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Enable Maven wrapper
        run: chmod +x mvnw

      - name: Run full verification and integration tests
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp verify 2>&1 | tee integration-test.log

      - name: Summarize integration failures
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          output = []
          reports = sorted(Path('.').glob('**/target/*-reports/TEST-*.xml'))
          for report in reports:
              try:
                  root = ET.parse(report).getroot()
              except (ET.ParseError, OSError) as exception:
                  output.append(f'UNREADABLE {report}: {exception}')
                  continue
              for testcase in root.findall('testcase'):
                  problem = testcase.find('failure')
                  if problem is None:
                      problem = testcase.find('error')
                  if problem is None:
                      continue
                  class_name = testcase.get('classname', root.get('name', 'unknown'))
                  test_name = testcase.get('name', 'unknown')
                  message = (problem.get('message') or '').strip()
                  detail = (problem.text or '').strip()
                  output.append(f'FAILED {class_name}#{test_name}')
                  if message:
                      output.append(message)
                  if detail:
                      output.extend(detail.splitlines()[:160])
                  output.append('')

          if not output:
              output.append('No XML failure/error entries found. Tail of Maven log follows:')
              log = Path('integration-test.log')
              if log.exists():
                  output.extend(log.read_text(errors='replace').splitlines()[-200:])

          summary = '\n'.join(output).rstrip() + '\n'
          Path('integration-failure-summary.txt').write_text(summary)
          print(summary)
          PY

      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-diagnostics
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            integration-test.log
            integration-failure-summary.txt
          if-no-files-found: warn

  validate:
    if: always()
    needs:
      - test
      - quality
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required CI gates
        shell: bash
        env:
          TEST_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          printf 'test=%s\nquality=%s\nintegration=%s\n' \
            "$TEST_RESULT" "$QUALITY_RESULT" "$INTEGRATION_RESULT"

          if [[ "$TEST_RESULT" != "success" || \
                "$QUALITY_RESULT" != "success" || \
                "$INTEGRATION_RESULT" != "success" ]]; then
            echo 'One or more required CI gates did not succeed.'
            exit 1
          fi
