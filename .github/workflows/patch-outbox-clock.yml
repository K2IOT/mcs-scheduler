name: Patch Outbox Test Clock

on:
  push:
    branches:
      - agent/final-acceptance-verification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-acceptance-verification
      - name: Inject a deterministic clock into OutboxPublisherKafkaIT
        shell: python
        run: |
          from pathlib import Path

          path = Path('scheduler-service/src/test/java/io/k2iot/mcs/scheduler/outbox/OutboxPublisherKafkaIT.java')
          text = path.read_text()
          text = text.replace('import java.time.Duration;\n', 'import java.time.Clock;\nimport java.time.Duration;\n')
          text = text.replace(
              'import org.springframework.boot.test.context.SpringBootTest;\n',
              'import org.springframework.boot.test.context.SpringBootTest;\nimport org.springframework.boot.test.context.TestConfiguration;\nimport org.springframework.context.annotation.Bean;\nimport org.springframework.context.annotation.Import;\nimport org.springframework.context.annotation.Primary;\n')
          text = text.replace(
              '@EmbeddedKafka(partitions = 1, topics = OutboxPublisherKafkaIT.EVENT_TOPIC)\nclass OutboxPublisherKafkaIT {',
              '@EmbeddedKafka(partitions = 1, topics = OutboxPublisherKafkaIT.EVENT_TOPIC)\n@Import(OutboxPublisherKafkaIT.FixedClockConfiguration.class)\nclass OutboxPublisherKafkaIT {')
          marker = '  private static final Instant NOW = Instant.parse("2026-08-07T13:00:00Z");\n'
          replacement = marker + '  private static final Instant PUBLISH_NOW = NOW.plusSeconds(30);\n'
          if marker not in text:
              raise SystemExit('NOW marker missing')
          text = text.replace(marker, replacement, 1)
          class_end = '''  private void cleanState() {
    jdbc.update("delete from scheduler.outbox_event");
    jdbc.update("delete from scheduler.execution");
    jdbc.update("delete from scheduler.trigger_definition");
    jdbc.update("delete from scheduler.job_definition");
    jdbc.update("delete from scheduler.destination");
  }
}'''
          replacement_end = '''  private void cleanState() {
    jdbc.update("delete from scheduler.outbox_event");
    jdbc.update("delete from scheduler.execution");
    jdbc.update("delete from scheduler.trigger_definition");
    jdbc.update("delete from scheduler.job_definition");
    jdbc.update("delete from scheduler.destination");
  }

  @TestConfiguration(proxyBeanMethods = false)
  static class FixedClockConfiguration {

    @Bean
    @Primary
    Clock outboxTestClock() {
      return Clock.fixed(PUBLISH_NOW, ZoneOffset.UTC);
    }
  }
}'''
          if class_end not in text:
              raise SystemExit('class end marker missing')
          path.write_text(text.replace(class_end, replacement_end, 1))
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp -pl scheduler-service -am spotless:apply
      - name: Commit deterministic clock fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scheduler-service/src/test/java/io/k2iot/mcs/scheduler/outbox/OutboxPublisherKafkaIT.java
          git commit -m 'test: make outbox kafka integration time deterministic'
          git push origin HEAD:agent/final-acceptance-verification
