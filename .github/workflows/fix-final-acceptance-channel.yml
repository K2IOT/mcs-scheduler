name: Fix Final Acceptance Channel

on:
  push:
    branches:
      - agent/final-acceptance-verification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-acceptance-verification
      - name: Replace non-closeable gRPC resource usage
        shell: python
        run: |
          from pathlib import Path

          path = Path('scheduler-service/src/test/java/io/k2iot/mcs/scheduler/acceptance/FinalAcceptanceIT.java')
          text = path.read_text()
          old = '''      try (ManagedChannel channel =
              ManagedChannelBuilder.forAddress(node.getHost(), node.getMappedPort(9090))
                  .usePlaintext()
                  .build();
          Consumer<String, String> restEvents = consumer(kafka, REST_EVENT_TOPIC);
          Consumer<String, String> commandResults = consumer(kafka, COMMAND_RESULT_TOPIC);
          Consumer<String, String> kafkaEvents = consumer(kafka, KAFKA_EVENT_TOPIC);
          Consumer<String, String> dlt = consumer(kafka, DLT_TOPIC);
          KafkaProducer<String, String> producer = producer(kafka)) {
        verifyRestCreationReplayConflictAndGrpcRead(
            node, channel, postgres, restDestinationId, restEvents);
        verifyGrpcReplayAndConflict(channel, postgres, grpcDestinationId);
        verifyKafkaCreationReplayConflictAndExecution(
            kafka, producer, commandResults, kafkaEvents, dlt, postgres, kafkaDestinationId);
      }
'''
          new = '''      ManagedChannel channel =
          ManagedChannelBuilder.forAddress(node.getHost(), node.getMappedPort(9090))
              .usePlaintext()
              .build();
      try (Consumer<String, String> restEvents = consumer(kafka, REST_EVENT_TOPIC);
          Consumer<String, String> commandResults = consumer(kafka, COMMAND_RESULT_TOPIC);
          Consumer<String, String> kafkaEvents = consumer(kafka, KAFKA_EVENT_TOPIC);
          Consumer<String, String> dlt = consumer(kafka, DLT_TOPIC);
          KafkaProducer<String, String> producer = producer(kafka)) {
        verifyRestCreationReplayConflictAndGrpcRead(
            node, channel, postgres, restDestinationId, restEvents);
        verifyGrpcReplayAndConflict(channel, postgres, grpcDestinationId);
        verifyKafkaCreationReplayConflictAndExecution(
            kafka, producer, commandResults, kafkaEvents, dlt, postgres, kafkaDestinationId);
      } finally {
        channel.shutdownNow();
        assertThat(channel.awaitTermination(10, TimeUnit.SECONDS)).isTrue();
      }
'''
          if old not in text:
              raise SystemExit('expected ManagedChannel block not found')
          path.write_text(text.replace(old, new))
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - name: Apply Spotless
        run: ./mvnw -B -ntp -pl scheduler-service -am spotless:apply
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scheduler-service/src/test/java/io/k2iot/mcs/scheduler/acceptance/FinalAcceptanceIT.java
          git commit -m 'test: close final acceptance grpc channel explicitly'
          git push origin HEAD:agent/final-acceptance-verification
