name: Task 15 Format Preview

on:
  push:
    branches:
      - feature/task15-process-kill

permissions:
  contents: write

jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/task15-process-kill
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply formatter and commit Task 15 test
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -pl scheduler-service spotless:apply
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scheduler-service/src/test/java/io/k2iot/mcs/scheduler/cluster/ProcessKillRecoveryIT.java
          git commit -m 'style: apply Task 15 Spotless formatting'
          git push origin HEAD:feature/task15-process-kill
