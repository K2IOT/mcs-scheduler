name: Patch gRPC Test Ports

on:
  push:
    branches:
      - agent/final-acceptance-verification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-acceptance-verification
      - name: Use random native gRPC ports in standalone Spring contexts
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('scheduler-service/src/test/java/io/k2iot/mcs/scheduler/quartz/QuartzConfigurationIT.java'),
              Path('scheduler-service/src/test/java/io/k2iot/mcs/scheduler/outbox/OutboxPublisherKafkaIT.java'),
              Path('scheduler-service/src/test/java/io/k2iot/mcs/scheduler/kafka/SchedulerCommandKafkaIT.java'),
              Path('scheduler-service/src/test/java/io/k2iot/mcs/scheduler/command/SchedulerCommandFacadeQuartzTest.java'),
          ]
          for path in files:
              text = path.read_text()
              if '"spring.grpc.server.port=0"' in text:
                  continue
              marker = '      "spring.flyway.enabled=true"'
              if marker not in text:
                  raise SystemExit(f'flyway marker missing in {path}')
              text = text.replace(marker, marker + ',\n      "spring.grpc.server.port=0"', 1)
              path.write_text(text)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp -pl scheduler-service -am spotless:apply
      - name: Commit test isolation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scheduler-service/src/test/java/io/k2iot/mcs/scheduler
          git commit -m 'test: isolate native grpc ports across integration contexts'
          git push origin HEAD:agent/final-acceptance-verification
