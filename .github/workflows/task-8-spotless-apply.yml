name: Task 8 Spotless Apply

on:
  push:
    branches:
      - agent/task-8-grpc-services

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: agent/task-8-grpc-services

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Enable Maven wrapper
        run: chmod +x mvnw

      - name: Apply Spotless
        run: ./mvnw -B spotless:apply

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Spotless made no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scheduler-service
          git commit -m "style: apply spotless formatting"
          git push origin HEAD:agent/task-8-grpc-services
