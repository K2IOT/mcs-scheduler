name: Task 3 Format Once

on:
  push:
    branches:
      - agent/task-3-domain-model
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/task-3-domain-model

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply repository formatter
        run: ./mvnw -B spotless:apply

      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scheduler-service/src/main/java scheduler-service/src/test/java
          git commit -m "style: apply Spotless formatting"
          git push origin HEAD:agent/task-3-domain-model
