name: Task 8 gRPC Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/task-8-grpc-services
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grpc-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Enable Maven wrapper
        run: chmod +x mvnw

      - name: Run focused Task 8 test
        run: ./mvnw -B -pl scheduler-service -am -Dtest=SchedulerCommandGrpcServiceTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Check Java formatting
        run: ./mvnw -B spotless:check

      - name: Run full Maven verification
        run: ./mvnw -B verify
