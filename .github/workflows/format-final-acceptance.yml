name: Format Final Acceptance

on:
  push:
    branches:
      - agent/final-acceptance-verification

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-acceptance-verification
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - name: Apply Spotless
        run: ./mvnw -B -ntp -pl scheduler-service -am spotless:apply
      - name: Commit formatted acceptance test
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scheduler-service/src/test/java/io/k2iot/mcs/scheduler/acceptance/FinalAcceptanceIT.java
          git commit -m 'style: format final acceptance test'
          git push origin HEAD:agent/final-acceptance-verification
