name: Task 7 REST Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/task-7-rest-control-plane
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rest-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Enable Maven wrapper
        run: chmod +x mvnw

      - name: Run focused Task 7 tests
        run: ./mvnw -B -pl scheduler-service -am -Dtest=ScheduleControllerTest,TriggerControllerTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Check Java formatting
        run: ./mvnw -B spotless:check

      - name: Capture Spotless formatting
        if: failure()
        run: |
          ./mvnw -B spotless:apply
          for file in \
            scheduler-service/src/test/java/io/k2iot/mcs/scheduler/rest/TriggerControllerTest.java \
            scheduler-service/src/main/java/io/k2iot/mcs/scheduler/rest/ProblemDetailsAdvice.java \
            scheduler-service/src/main/java/io/k2iot/mcs/scheduler/rest/TriggerController.java \
            scheduler-service/src/main/java/io/k2iot/mcs/scheduler/rest/JobController.java \
            scheduler-service/src/main/java/io/k2iot/mcs/scheduler/rest/RestModels.java \
            scheduler-service/src/main/java/io/k2iot/mcs/scheduler/rest/RestCommandMapper.java \
            scheduler-service/src/main/java/io/k2iot/mcs/scheduler/rest/ScheduleController.java
          do
            echo "::group::$file"
            cat "$file"
            echo "::endgroup::"
          done

      - name: Run full Maven verification
        run: ./mvnw -B verify
