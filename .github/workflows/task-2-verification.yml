name: Task 2 Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/task-2-postgresql-quartz-schemas
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Enable Maven wrapper
        run: chmod +x mvnw

      - name: Run focused database migration integration test
        run: ./mvnw -B -pl scheduler-service -am -Dtest=DatabaseMigrationIT -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Run full Maven verification
        run: ./mvnw -B verify
