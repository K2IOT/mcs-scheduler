name: Patch Final Acceptance gRPC Readiness

on:
  push:
    branches:
      - agent/final-acceptance-verification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-acceptance-verification
      - name: Wait for the native gRPC server to become ready
        shell: python
        run: |
          from pathlib import Path
          path = Path('scheduler-service/src/test/java/io/k2iot/mcs/scheduler/acceptance/FinalAcceptanceIT.java')
          text = path.read_text()
          text = text.replace(
              '    var query = SchedulerQueryServiceGrpc.newBlockingStub(channel);',
              '    var query =\n        SchedulerQueryServiceGrpc.newBlockingStub(channel)\n            .withWaitForReady()\n            .withDeadlineAfter(15, TimeUnit.SECONDS);')
          text = text.replace(
              '    var command = SchedulerCommandServiceGrpc.newBlockingStub(channel);',
              '    var command =\n        SchedulerCommandServiceGrpc.newBlockingStub(channel)\n            .withWaitForReady()\n            .withDeadlineAfter(15, TimeUnit.SECONDS);')
          path.write_text(text)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp -pl scheduler-service -am spotless:apply
      - name: Commit readiness fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scheduler-service/src/test/java/io/k2iot/mcs/scheduler/acceptance/FinalAcceptanceIT.java
          git commit -m 'test: wait for final acceptance grpc readiness'
          git push origin HEAD:agent/final-acceptance-verification
