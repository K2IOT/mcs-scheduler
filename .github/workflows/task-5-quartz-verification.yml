name: Task 5 Quartz Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/task-5-quartz-trigger-mapping
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quartz-trigger-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Enable Maven wrapper
        run: chmod +x mvnw

      - name: Run focused Task 5 tests
        run: ./mvnw -B -pl scheduler-service -am -Dtest=QuartzTriggerMapperTest,QuartzSchedulerProjectionTest,QuartzConfigurationIT -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Show Java formatting patch
        run: |
          ./mvnw -B spotless:apply
          git diff -- scheduler-service/src
          git diff --exit-code -- scheduler-service/src

      - name: Run full Maven verification
        run: ./mvnw -B verify
