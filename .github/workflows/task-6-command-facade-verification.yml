name: Task 6 Command Facade Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/task-6-transactional-command-facade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transactional-command-facade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Enable Maven wrapper
        run: chmod +x mvnw

      - name: Run focused Task 6 tests
        run: ./mvnw -B -pl scheduler-service -am -Dtest=SchedulerCommandFacadeTest,SchedulerCommandFacadeIT,SchedulerCommandFacadeQuartzTest,RequestFingerprintTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Check Java formatting
        run: ./mvnw -B spotless:check

      - name: Run full Maven verification
        run: ./mvnw -B verify
