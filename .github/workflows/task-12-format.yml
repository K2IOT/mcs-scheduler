name: Task 12 Format

on:
  push:
    branches:
      - agent/task-12-lifecycle-reconciliation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task-12-lifecycle-reconciliation
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp spotless:apply
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scheduler-service
          git commit -m "style: apply task 12 spotless formatting"
          git push origin HEAD:agent/task-12-lifecycle-reconciliation
