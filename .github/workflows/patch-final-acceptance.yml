name: Patch Final Acceptance Fixture

on:
  push:
    branches:
      - agent/final-acceptance-verification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-acceptance-verification
      - name: Use a distinct gRPC destination topic
        shell: python
        run: |
          from pathlib import Path
          path = Path('scheduler-service/src/test/java/io/k2iot/mcs/scheduler/acceptance/FinalAcceptanceIT.java')
          text = path.read_text()
          text = text.replace(
              '  private static final String REST_EVENT_TOPIC = "mcs.scheduler.final.rest-events";\n  private static final String KAFKA_EVENT_TOPIC = "mcs.scheduler.final.kafka-events";',
              '  private static final String REST_EVENT_TOPIC = "mcs.scheduler.final.rest-events";\n  private static final String GRPC_EVENT_TOPIC = "mcs.scheduler.final.grpc-events";\n  private static final String KAFKA_EVENT_TOPIC = "mcs.scheduler.final.kafka-events";')
          text = text.replace(
              '      createTopic(kafka, REST_EVENT_TOPIC);\n      createTopic(kafka, KAFKA_EVENT_TOPIC);',
              '      createTopic(kafka, REST_EVENT_TOPIC);\n      createTopic(kafka, GRPC_EVENT_TOPIC);\n      createTopic(kafka, KAFKA_EVENT_TOPIC);')
          text = text.replace(
              '      registerDestination(postgres, grpcDestinationId, REST_EVENT_TOPIC);',
              '      registerDestination(postgres, grpcDestinationId, GRPC_EVENT_TOPIC);')
          path.write_text(text)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp -pl scheduler-service -am spotless:apply
      - name: Commit fixture fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scheduler-service/src/test/java/io/k2iot/mcs/scheduler/acceptance/FinalAcceptanceIT.java
          git commit -m 'test: isolate final acceptance grpc destination'
          git push origin HEAD:agent/final-acceptance-verification
